<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício flexbox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <p>1.</p>
    <div class="container row-right-end">
        <div>Card 1</div>
        <div>Card 2</div>
        <div>Card 3</div>       
    </div>
    
    <p>2.</p>
    <div class="container column-center-space-between">
        <div>Card 1</div>
        <div>Card 2</div>
        <div>Card 3</div>       
    </div>

    <p>3.</p>
    <div class="container row-right-start">
        <div>Card 1</div>
        <div>Card 2</div>
        <div>Card 3</div>       
    </div>

    <p>4.</p>
    <div class="container column-center">
        <div>Card 1</div>
        <div>Card 2</div>
        <div>Card 3</div>       
    </div>
    
    <p>5.</p>
    <div class="container row-center-start">
        <div>Card 1</div>
        <div>Card 2</div>
        <div>Card 3</div>       
    </div>

</body>
</html>
